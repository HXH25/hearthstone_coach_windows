<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">HearthCoach system architecture</title>
<desc id="desc">Hearthstone logs and HDT data are converted to a structured snapshot, used by an LLM slow planner and Rust fast agent, then surfaced through the Control Center and overlay.</desc>
<style>
  .t{font-family:Inter,Segoe UI,Microsoft YaHei,sans-serif;fill:#111827}.muted{fill:#667085}.small{font-size:16px}.title{font-size:24px;font-weight:700}.label{font-size:14px;font-weight:700;letter-spacing:1px}.box{fill:#fff;stroke:#d9dfe8;stroke-width:2}.soft{fill:#f5f7fb}.blue{fill:#edf3ff;stroke:#b7c8ff}.green{fill:#edf9f4;stroke:#b7e5d0}.dark{fill:#172033}.white{fill:#fff}.arrow{stroke:#96a0ae;stroke-width:3;fill:none;marker-end:url(#m)}
</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#96a0ae"/></marker></defs>
<rect width="1200" height="550" rx="24" fill="#fbfcfe"/>

<rect class="box soft" x="40" y="170" width="190" height="90" rx="18"/>
<text class="t title" x="135" y="207" text-anchor="middle">Hearthstone</text>
<text class="t muted small" x="135" y="235" text-anchor="middle">Power.log · Choice logs</text>

<rect class="box soft" x="40" y="300" width="190" height="90" rx="18"/>
<text class="t title" x="135" y="337" text-anchor="middle">HDT / HearthDb</text>
<text class="t muted small" x="135" y="365" text-anchor="middle">cards · tribes · pool facts</text>

<rect class="box" x="300" y="190" width="220" height="180" rx="20"/>
<text class="t label" x="330" y="225">STATE RECONSTRUCTION</text>
<text class="t title" x="330" y="267">Monitor / Parser</text>
<text class="t muted small" x="330" y="298">EntityStore</text>
<text class="t muted small" x="330" y="326">StateProjector</text>
<text class="t muted small" x="330" y="354">HarnessRuntime</text>

<rect class="box blue" x="590" y="223" width="180" height="114" rx="20"/>
<text class="t label" x="620" y="255">STRUCTURED</text>
<text class="t title" x="620" y="294">Snapshot</text>
<text class="t muted small" x="620" y="320">live game state</text>

<rect class="box blue" x="850" y="80" width="250" height="150" rx="20"/>
<text class="t label" x="880" y="115">SLOW · LLM</text>
<text class="t title" x="880" y="154">Strategic Planner</text>
<text class="t muted small" x="880" y="183">RoundPlan · Watchlist</text>
<text class="t muted small" x="880" y="208">Trinkets · Chat</text>

<rect class="box green" x="850" y="310" width="250" height="150" rx="20"/>
<text class="t label" x="880" y="345">FAST · RUST</text>
<text class="t title" x="880" y="384">Tactical Agent</text>
<text class="t muted small" x="880" y="413">score candidate actions</text>
<text class="t muted small" x="880" y="438">→ TacticalPlan</text>

<rect class="dark" x="1130" y="188" width="38" height="184" rx="19"/>
<text class="white t label" transform="translate(1154 342) rotate(-90)">OVERLAY · CONTROL CENTER</text>

<path class="arrow" d="M230 215 C265 215 265 235 300 235"/>
<path class="arrow" d="M230 345 C265 345 265 325 300 325"/>
<path class="arrow" d="M520 280 L590 280"/>
<path class="arrow" d="M770 260 C810 260 810 160 850 160"/>
<path class="arrow" d="M770 300 C810 300 810 385 850 385"/>
<path class="arrow" d="M975 230 C975 270 975 270 975 310"/>
<path class="arrow" d="M1100 155 C1120 155 1120 230 1130 230"/>
<path class="arrow" d="M1100 385 C1120 385 1120 330 1130 330"/>

<text class="t muted small" x="782" y="255">state</text>
<text class="t muted small" x="995" y="275">plans</text>
</svg>
